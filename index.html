<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kickboxing PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; padding:16px; background:#f6f9fc; color:#111;}
    header { background:#0d47a1; color:white; padding:12px; border-radius:8px;}
    main { margin-top:16px;}
    .button { display:inline-block; padding:8px 12px; background:#0d47a1; color:white; border-radius:6px; text-decoration:none;}
  </style>
</head>
<body>
  <header>
    <h1>Kickboxing PWA</h1>
    <p>نسخه‌ی آزمایشی آفلاین آماده</p>
  </header>
  <main>
    <p>این یک PWA نمونه است. با فعال‌سازی Service Worker، محتوای اصلی هنگام آفلاین هم در دسترس خواهد بود.</p>
    <p><a class="button" href="offline.html">صفحه‌ی آفلاین</a></p>
    <p id="status">در حال ثبت Service Worker...</p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => {
          console.log('SW registered', reg);
          document.getElementById('status').textContent = 'Service Worker ثبت شد.';
        })
        .catch(err => {
          console.warn('SW register failed', err);
          document.getElementById('status').textContent = 'ثبت Service Worker ناموفق بود.';
        });
    } else {
      document.getElementById('status').textContent = 'مرورگر شما از Service Worker پشتیبانی نمی‌کند.';
    }
  </script>
</body>
</html>
